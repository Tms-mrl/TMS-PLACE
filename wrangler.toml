# El Muelle Places — Worker único: API Hono + SSR público del marketplace +
# SPA de gestión servida por assets.
#
# Standalone, cuenta de Cloudflare propia (no la del compañero que maneja Coopenplace).
# Ya provisionado: este `account_id`/`database_id`/bucket son los reales, de un deploy
# anterior de esta misma app bajo la misma cuenta (`elmuelle.tomyredrebell.workers.dev`,
# vivo). Un solo tenant: no hay más split [env.<cliente>] — esta es LA agencia (El Muelle).
#
# Secrets (wrangler secret put <NOMBRE>, NUNCA acá):
#   GOOGLE_CLIENT_SECRET — OAuth de Google (login). Ver GOOGLE_CLIENT_ID en [vars] abajo.
#   INTERNAL_API_SECRET  — futuro: emails (alertas de búsquedas guardadas).
#   SCRAPER_URL           — proxy de scraping para el import de Argenprop (opcional).
#   GMAIL_CLIENT_SECRET   — OAuth de Gmail (apartado "Correo"), CLIENT PROPIO Y SEPARADO
#                            del login. Ver GMAIL_CLIENT_ID en [vars] abajo.
#   MAIL_TOKEN_KEY         — clave AES-GCM (32 bytes, base64) que cifra el refresh token
#                            de Gmail guardado en D1 (tabla mail_account).
name = "elmuelle"
main = "src/worker/index.ts"
account_id = "d9eac09aa903fdf10ee5a521bd0186dc"
# Máximo soportado por el workerd de wrangler ~4.85 (pineado por Node 20).
compatibility_date = "2026-05-01"
workers_dev = true

# Sin dominio propio todavía: el Worker sirve en https://elmuelle.tomyredrebell.workers.dev
# Cuando haya un dominio, agregar acá: routes = [{ pattern = "tu-dominio.com", custom_domain = true }]

# El Worker corre PRIMERO en TODA request: renderiza SSR el marketplace público
# (indexable) y delega a ASSETS los estáticos y la SPA de gestión (/app/*). El fallback
# SPA sirve index.html para rutas client-side.
[assets]
directory = "dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "coopen-places-db"
database_id = "12c87ac7-fc47-4db4-abbc-c6617b12eedf"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "coopen-places-media"

[vars]
# OAuth Client ID de Google (Google Cloud Console → APIs & Services → Credentials →
# OAuth client ID, tipo "Web application"), propio, ya autorizado para este dominio.
# No es secreto, pero el Client Secret sí (`wrangler secret put GOOGLE_CLIENT_SECRET`).
GOOGLE_CLIENT_ID = "932608486382-eirj5s8emld2vfr64pruprtg1po1rprn.apps.googleusercontent.com"
# Super-admins del panel interno: email (o auth_sub) separados por coma.
SUPER_ADMIN_SUBS = "tomasmoodleiram@gmail.com"
# Base pública del sitio (para links en emails del cron; no hay request ahí para derivarla).
SITE_URL = "https://elmuelle.tomyredrebell.workers.dev"
# OAuth Client ID del apartado "Correo" (proyecto de Google Cloud APARTE del login,
# con la Gmail API habilitada — ver docs/ideas.md).
GMAIL_CLIENT_ID = "932608486382-6pumps3o8pnvfaedg3bl0ca61ecdqkpc.apps.googleusercontent.com"

# Cron: dos triggers, distinguidos por event.cron en scheduled() (src/worker/index.ts).
# "0 13 * * *"  → alertas de búsquedas guardadas por email (dormante hasta que se
#                 conecte un proveedor de mail, ver lib/alerts.ts).
# "* * * * *"   → sync de Correo (Gmail), 1/min = piso de Cloudflare Cron Triggers.
[triggers]
crons = ["0 13 * * *", "* * * * *"]
